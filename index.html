    <script>
      (() => {
        const SOCIAL_IMAGE_PATH = "img_source/to3-social.jpg";
        const CACHE_PARAM = "fbv";
        const pageUrl = new URL(window.location.href);
        const createCacheToken = () => {
          const now = new Date();
          const pad = (value, size = 2) => String(value).padStart(size, "0");
          return [
            now.getFullYear(),
            pad(now.getMonth() + 1),
            pad(now.getDate()),
            pad(now.getHours()),
            pad(now.getMinutes()),
            pad(now.getSeconds()),
            pad(now.getMilliseconds(), 3)
          ].join("");
        };

        const cacheToken = pageUrl.searchParams.get(CACHE_PARAM)?.trim() || createCacheToken();
        pageUrl.searchParams.set(CACHE_PARAM, cacheToken);

        const imageUrl = new URL(SOCIAL_IMAGE_PATH, `${window.location.origin}${window.location.pathname}`);
        imageUrl.searchParams.set(CACHE_PARAM, cacheToken);

        document.getElementById("og-image")?.setAttribute("content", imageUrl.toString());
        document.getElementById("og-image-secure")?.setAttribute("content", imageUrl.toString());
        document.getElementById("twitter-image")?.setAttribute("content", imageUrl.toString());
      })();
    </script>
