    <script>
      (() => {
        const SEARCH_PARAM_MAP = {
          k: ["k", "guestName", "tenkhach", "ten"],
          g: ["g", "guestPronoun", "goikhach", "danhxung"],
          x: ["x", "hostPronoun", "xungho", "minh"],
          m: ["m", "openingMessage", "loimoi", "introMessage"],
          n: ["n", "openingSubNote", "ghichu", "introNote"],
          h: ["h", "mealInvitationHour", "mealHour", "giocom"],
          d: ["d", "mealInvitationDate", "mealDate", "ngaycom"],
          v: ["v", "mealInvitationVenue", "mealVenue", "diadiemcom"]
        };
        const SOCIAL_IMAGE_PATH = "img_source/to3-social.jpg";
        const CACHE_PARAM = "fbv";
        const pageUrl = new URL(window.location.href);
        const searchParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, "").replace(/^\?/, ""));
        const normalizedParams = new URLSearchParams();
        const pickValue = (keys) => {
          for (const source of [hashParams, searchParams]) {
            for (const key of keys) {
              const value = source.get(key)?.trim();
              if (value) return value;
            }
          }
          return "";
        };
        const createCacheToken = () => {
          const now = new Date();
          const pad = (value, size = 2) => String(value).padStart(size, "0");
          return [
            now.getFullYear(),
            pad(now.getMonth() + 1),
            pad(now.getDate()),
            pad(now.getHours()),
            pad(now.getMinutes()),
            pad(now.getSeconds()),
            pad(now.getMilliseconds(), 3)
          ].join("");
        };

        Object.entries(SEARCH_PARAM_MAP).forEach(([shortKey, keys]) => {
          const value = pickValue(keys);
          if (value) normalizedParams.set(shortKey, value);
        });

        const preservedPage = searchParams.get("page")?.trim();
        const preservedView = searchParams.get("view")?.trim();
        if (preservedPage) normalizedParams.set("page", preservedPage);
        if (preservedView) normalizedParams.set("view", preservedView);

        normalizedParams.set(CACHE_PARAM, hashParams.get(CACHE_PARAM)?.trim() || searchParams.get(CACHE_PARAM)?.trim() || createCacheToken());
        pageUrl.search = normalizedParams.toString();
        pageUrl.hash = "";

        const imageUrl = new URL(SOCIAL_IMAGE_PATH, `${window.location.origin}${window.location.pathname}`);
        imageUrl.searchParams.set(CACHE_PARAM, normalizedParams.get(CACHE_PARAM));

        document.getElementById("canonical-url")?.setAttribute("href", pageUrl.toString());
        document.getElementById("og-url")?.setAttribute("content", pageUrl.toString());
        document.getElementById("og-image")?.setAttribute("content", imageUrl.toString());
        document.getElementById("og-image-secure")?.setAttribute("content", imageUrl.toString());
        document.getElementById("twitter-image")?.setAttribute("content", imageUrl.toString());
      })();
    </script>
